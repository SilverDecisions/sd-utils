name: CI

on:
  push:
    branches: [master, 'modernize/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build check (Node ${{ matrix.node }}, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 24: developer version (.nvmrc); 22: previous LTS
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Versions
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The committed dist/ is the 0.1.15 release build and predates the fixes,
      # so the tests run on fresh builds only. Isolated copy: npm ci, build, artifacts, tests on both fresh bundles,
      # tarball installed into a browserify + babelify consumer, compile error exit code
      - name: npm run test:build
        run: npm run test:build

  windows-smoke:
    name: Build smoke (Node ${{ matrix.node }}, Windows)
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Versions
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: npm run build
        timeout-minutes: 5
        run: npm run build

      - name: Tests on the fresh dist (standalone and module bundles)
        shell: bash
        run: |
          SD_UTILS_TARGET=standalone npm test
          SD_UTILS_TARGET=module npm test

      - name: The build changed nothing outside dist/
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- . ':(exclude)dist')"
          echo "$changes"
          test -z "$changes"

      - name: Build check in an isolated copy (without the consumer install)
        run: node scripts/check-build.js --skip-consumer
